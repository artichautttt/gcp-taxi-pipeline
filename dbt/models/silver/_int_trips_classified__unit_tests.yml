# Unit tests (dbt 1.8+): one fake bronze row per rule, from a valid base
# trip, checked against the reason or flag int_trips_classified gives it.
# trips_quarantine copies exclusion_reason as rejection_reason; trips keeps
# the rows where it is null.
# Rules: docs/qualite.md.
version: 2
unit_tests:
- name: int_trips_classified_kept_valid_trip
  description: Une course valide est gardée, sans alerte.
  model: int_trips_classified
  overrides:
    vars:
      pipeline_month: 202501
  given:
  - input: ref('stg_yellow_trips')
    rows:
    - source_month: 202501
      vendor_id: 2
      pickup_datetime: '2025-01-15 10:00:00'
      dropoff_datetime: '2025-01-15 10:20:00'
      passenger_count: 1
      trip_distance: 3.0
      rate_code_id: 1
      store_and_fwd_flag: N
      pickup_zone_id: 132
      dropoff_zone_id: 236
      payment_type_id: 1
      fare_amount: 20.0
      extra: 1.0
      mta_tax: 0.5
      tip_amount: 4.0
      tolls_amount: 0.0
      improvement_surcharge: 1.0
      total_amount: 30.0
      congestion_surcharge: 2.5
      airport_fee: 0.0
  - input: ref('taxi_zone_lookup')
    rows: &id001
    - location_id: 132
      is_unknown: false
    - location_id: 236
      is_unknown: false
    - location_id: 264
      is_unknown: true
  - input: ref('payment_type_lookup')
    rows:
    - payment_type_id: 1
  - input: ref('rate_code_lookup')
    rows:
    - rate_code_id: 1
    - rate_code_id: 99
  expect:
    rows:
    - exclusion_reason: null
      flag_unknown_zone: false
      flag_passenger_count: false
      flag_short_trip: false
