# dbt project, two independent parts:
#
# 1. Legacy quality gate (models/sources.yml, source `nyc_taxi`): tests the
#    tables built by sql/01-03 (trips_clean, daily_kpis) in dataset nyc_taxi.
#    The nyc_taxi_pipeline DAG runs only these tests (`dbt test --select source:nyc_taxi`).
#
# 2. Medallion pipeline, one dataset per layer (BQ_*_DATASET, defaults below):
#      bronze  nyc_taxi_bronze  sources as received + ingestion columns
#              (written by ingestion/bronze.py, not by dbt)
#      silver  nyc_taxi_silver  models/silver + seeds: typed, checked rows
#              (trips), rejected rows (trips_quarantine), row accounting
#      gold    nyc_taxi_gold    models/gold: star schema and aggregates
#    One month per run: dbt run --vars '{pipeline_month: 202501, run_id: "..."}'.
#
# The profile's dataset (BQ_DATASET, nyc_taxi) only serves the legacy part:
# macros/generate_schema_name.sql writes each layer to its own dataset.
name: nyc_taxi
version: "1.0.0"
config-version: 2
profile: nyc_taxi

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages", "logs"]

vars:
  # Month to build, YYYYMM. No default on purpose: a run without it fails
  # instead of silently rebuilding the wrong month (see macros/pipeline_month.sql).
  # pipeline_month: 202501
  dim_date_start: "2024-01-01"
  dim_date_end: "2026-12-31"
  # Run id written on quarantined rows; default: dbt's invocation_id.
  # run_id: manual__2026-10-30T10:00:00+00:00
  # TLC XML control (gold.tlc_zone_reconciliation, docs/qualite.md): a zone
  # is flagged when |bronze pickups - TLC pickups| > tlc_alert_gap_pct % of the
  # TLC count, for zones with at least tlc_alert_min_trips trips on one side.
  tlc_alert_gap_pct: 10
  tlc_alert_min_trips: 1000

models:
  nyc_taxi:
    silver:
      +schema: "{{ env_var('BQ_SILVER_DATASET', 'nyc_taxi_silver') }}"
      +materialized: view
    gold:
      +schema: "{{ env_var('BQ_GOLD_DATASET', 'nyc_taxi_gold') }}"
      +materialized: table

seeds:
  nyc_taxi:
    +schema: "{{ env_var('BQ_SILVER_DATASET', 'nyc_taxi_silver') }}"
    taxi_zone_lookup:
      +column_types:
        location_id: int64
        borough: string
        zone: string
        service_zone: string
        is_airport: bool
        is_unknown: bool
    payment_type_lookup:
      +column_types:
        payment_type_id: int64
        payment_type_name: string
    rate_code_lookup:
      +column_types:
        rate_code_id: int64
        rate_code_name: string
