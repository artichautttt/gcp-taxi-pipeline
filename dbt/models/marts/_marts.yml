version: 2

models:
  - name: fct_trips
    description: >
      Star-schema fact table, one row per kept trip. Incremental by month
      (insert_overwrite on the integer partition pickup_month, copy jobs, no
      DML). Rows breaking a rule are not here: see audit_trip_rows.
    columns:
      - name: trip_id
        description: FARM_FINGERPRINT of the full raw row (exact duplicates share it and are excluded).
        data_tests: [unique, not_null]
      - name: pickup_month
        description: Pickup month YYYYMM, equal to the raw file month. Partition key.
        data_tests: [not_null]
      - name: pickup_date
        description: Pickup day, key to dim_date.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: pickup_zone_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_zones')
                field: zone_id
      - name: dropoff_zone_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_zones')
                field: zone_id
      - name: payment_type_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_payment_type')
                field: payment_type_id
      - name: rate_code_id
        description: TLC rate code; null in the raw data (Flex Fare rows) is mapped to 99 (Null/unknown).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_rate_code')
                field: rate_code_id
      - name: vendor_id
        description: TLC vendor code (1, 2, 6, 7 in the 2025 data dictionary). Warns on a new code.
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 6, 7]
                quote: false
              config:
                severity: warn
      - name: trip_distance_mi
        data_tests:
          - value_between:
              arguments:
                min_value: 0.01
                max_value: 200
      - name: trip_duration_min
        data_tests:
          - value_between:
              arguments:
                min_value: 0
                max_value: 360
      - name: fare_amount
        data_tests:
          - value_between:
              arguments:
                min_value: 0
                max_value: 1000

  - name: audit_trip_rows
    description: >
      Row accounting per raw file month: rows kept in fct_trips and rows
      excluded, per rule (one reason per row, first rule broken). Documents
      every excluded row by count; the rows themselves stay in the raw table.
    columns:
      - name: source_month
        data_tests: [not_null]
      - name: row_outcome
        description: kept, or the exclusion rule (see int_trips_classified.sql).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - kept
                  - missing_timestamp
                  - pickup_outside_file_month
                  - dropoff_before_pickup
                  - duration_over_6h
                  - invalid_distance
                  - invalid_fare
                  - invalid_total
                  - duplicate
      - name: row_count
        data_tests: [not_null, positive]

  - name: dim_zones
    description: NYC taxi zones (265 rows, 2 unknown, 3 airports).
    columns:
      - name: zone_id
        data_tests: [unique, not_null]
      - name: borough
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [Bronx, Brooklyn, EWR, Manhattan, Queens, Staten Island, Unknown]

  - name: dim_payment_type
    columns:
      - name: payment_type_id
        data_tests: [unique, not_null]
      - name: payment_type_name
        data_tests: [not_null]

  - name: dim_rate_code
    columns:
      - name: rate_code_id
        data_tests: [unique, not_null]
      - name: rate_code_name
        data_tests: [not_null]

  - name: dim_date
    description: Calendar from var dim_date_start to dim_date_end.
    columns:
      - name: date_day
        data_tests: [unique, not_null]
      - name: weekday_name
        data_tests:
          - accepted_values:
              arguments:
                values: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday]
