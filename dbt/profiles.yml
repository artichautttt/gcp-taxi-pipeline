# Authentication: method "oauth" = Application Default Credentials (ADC),
# i.e. `gcloud auth application-default login [--impersonate-service-account=...]`.
# No service account key file is used or needed.
nyc_taxi:
  target: sandbox
  outputs:
    sandbox:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: "{{ env_var('BQ_DATASET', 'nyc_taxi') }}"
      location: US
      threads: 4
      job_execution_timeout_seconds: 300
      priority: interactive
